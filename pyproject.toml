
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manovel-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "google-genai"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["apps", "worker"]
